name: CI/CD Pipeline - Docker & Railway Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-lint-and-build:
    name: Code Linting & Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript & Vite Build
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker image build
        run: docker build . -t webrtc-demo:test

  deploy-to-railway:
    name: Deploy to Railway
    needs: ci-lint-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          # Workspace Token: generated from railway.com/account/tokens (select your workspace)
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          ARGS="--detach"

          # Specify project ID (required when using workspace token)
          if [ -n "${{ secrets.RAILWAY_PROJECT_ID }}" ]; then
            ARGS="$ARGS --project ${{ secrets.RAILWAY_PROJECT_ID }}"
          fi

          # --environment is required when --project is specified; default to 'production'
          ENVIRONMENT="${{ secrets.RAILWAY_ENVIRONMENT }}"
          ARGS="$ARGS --environment ${ENVIRONMENT:-production}"

          # Optionally target a specific service
          if [ -n "${{ secrets.RAILWAY_SERVICE_NAME }}" ]; then
            ARGS="$ARGS --service ${{ secrets.RAILWAY_SERVICE_NAME }}"
          fi

          echo "Running: railway up $ARGS"
          railway up $ARGS
