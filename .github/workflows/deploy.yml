name: CI/CD Pipeline - Docker & Railway Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci-lint-and-build:
    name: Code Linting & Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript & Vite Build
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker image build
        run: docker build . -t webrtc-demo:test

  deploy-to-railway:
    name: Deploy to Railway
    needs: ci-lint-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway via CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Error: RAILWAY_TOKEN is not configured in GitHub Secrets."
            exit 1
          fi
          
          if [ -n "$RAILWAY_SERVICE_NAME" ]; then
            echo "Deploying to Railway service: $RAILWAY_SERVICE_NAME"
            npx @railway/cli up --service "$RAILWAY_SERVICE_NAME" --detach
          else
            echo "Deploying to Railway default service..."
            npx @railway/cli up --detach
          fi
